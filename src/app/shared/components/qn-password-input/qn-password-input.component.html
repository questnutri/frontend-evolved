<p-password
    [(ngModel)]="value"
    [feedback]="false"
    [toggleMask]="showPassword()"
    [disabled]="disabled()"
    [size]="fontSize()"
    fluid
    [placeholder]="placeholder()"
    (mouseenter)="onMouseEnter()"
    (mouseleave)="onMouseLeave()"
    [style]="{ width: width(), cursor: cursor() }"
/>
