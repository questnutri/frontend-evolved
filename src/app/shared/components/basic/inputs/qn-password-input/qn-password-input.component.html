<qn-div [style.width]="width()">
    <p-password
        [(ngModel)]="value"
        [feedback]="false"
        [toggleMask]="showPassword()"
        [disabled]="disabled()"
        fluid
        [placeholder]="placeholder()"
        (mouseenter)="onMouseEnter()"
        (mouseleave)="onMouseLeave()"
        [style.width]="width()"
        [style.cursor]="cursor()"
    />
</qn-div>
