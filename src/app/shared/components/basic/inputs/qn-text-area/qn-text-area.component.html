<textarea
    pTextarea
    style="resize: none"
    [(ngModel)]="value"
    [autocomplete]="autocomplete()"
    fluid
    [disabled]="disabled()"
    [placeholder]="placeholder()"
    [rows]="rows()"
    [cols]="cols()"
    [autoResize]="false"
    (mouseenter)="onMouseEnter()"
    (mouseleave)="onMouseLeave()"
    [style.width]="width()"
    [style.cursor]="cursor()"
></textarea>
