<p-toast
    key="achievement"
    [style.width]="deviceService.isMobileSize() ? '90vw' : '320px'"
    [position]="'top-right'"
    [style]="{ top: deviceService.isMobileSize() ? '60px' : undefined }"
>
    <ng-template let-message #headless let-closeFn="closeFn">
        <section class="flex flex-col gap-3 p-4 w-full rounded-lg bg-(--primary-color) backdrop-blur-md shadow-lg">
            <div class="flex items-center justify-between">
                <span class="text-xs font-medium text-white/70 dark:text-black/70 uppercase tracking-wide">
                    Nova conquista desbloqueada
                </span>
                <button 
                    (click)="closeFn($event)" 
                    class="flex-shrink-0 w-6 h-6 flex items-center justify-center rounded-full bg-white/20 hover:bg-white/30 transition-colors text-white dark:text-black"
                    aria-label="Close"
                >
                    ×
                </button>
            </div>

            <div class="flex items-start gap-3">
                <div class="coin-container">
                <div class="coin">
                    <div class="coin-face coin-front"></div>
                    <div class="coin-face coin-back">
                        <span class="coin-icon">🏆</span>
                    </div>
                </div>
            </div>

                <div class="flex-1 flex flex-col gap-0.5 min-w-0">
                    <span class="text-base font-semibold text-white dark:text-black leading-tight">
                        {{ message.data?.title }}
                    </span>
                    <span class="text-xs text-white/80 dark:text-black/80 leading-snug">
                        {{ message.data?.message }}
                    </span>
                </div>
            </div>
        </section>
    </ng-template>
</p-toast>

<p-toast
    [style.width]="deviceService.isMobileSize() ? '90vw' : '400px'"
    [position]="deviceService.isMobileSize() ? 'bottom-right' : 'top-right'"
>
</p-toast>
