<qn-div flex-column gap="20px" justifyContent="space-between">
    <qn-text-input
        type="email"
        [(value)]="email"
        qnLabel="E-mail"
        placeholder="seu@email.com"
    />
    <qn-div
        background="'rgb(	240, 249, 255)"
        border="1px solid #bae6fd"
        radius="8px"
        padding="12px"
        flex
        gap="10px"
        alignItems="center"
    >
        <i
            class="pi pi-info-circle"
            [style.color]="'#0284c7'"
            [style.font-size]="'16px'"
            [style.margin-top]="'2px'"
        ></i>
        <span
            [style.font-size]="'13px'"
            [style.color]="'#0c4a6e'"
            [style.line-height]="'1.4'"
            [style.text-align]="'justify'"
        >
            Enviaremos um código de verificação de 6 dígitos para o e-mail
            informado. Verifique também sua caixa de spam.
        </span>
    </qn-div>

    <qn-button
        label="Enviar Código"
        (click)="sendVerificationCode()"
        width="70%"
        cursor="pointer"
    />
</qn-div>
