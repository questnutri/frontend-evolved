<qn-div
    class="login-container"
    flex-column
    gap="20px"
    justifyContent="space-between"
    style="box-sizing: border-box;"
>
    <h2 class="login-title">Login</h2>

    <qn-text-input
        type="email"
        [(value)]="emailInput"
        qnLabel="E-mail"
        width="100%"
        height="50px"
        style="width: 100%; max-width: 100%;"
    />

    <qn-password-input
        [(value)]="passwordInput"
        qnLabel="Senha"
        width="100%"
        height="50px"
        style="width: 100%; max-width: 100%;"
    />

    <a href="/forgot-password" class="forgot-password">Esqueci minha senha</a>

    <qn-button
        label="Login"
        (click)="doLogin()"
        class="login-button"
        cursor="pointer"
        width="100%"
        height="48px"
        [style.align-self]="'center'"
    />

    <qn-div flex-column alignItems="center" gap="8px" style="margin-top: 16px;">
        <span class="register-text">É nutricionista?</span>
        <a href="/register" class="register-link">
            Cadastre-se aqui
        </a>
    </qn-div>
</qn-div>
