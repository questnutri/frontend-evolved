<div style="overflow-y: auto; height: 100%">
    <div class="register-container">
    <!-- Main Card -->
    <div class="register-card">
        <!-- Logo inside card -->
        <img
            src="/logo/qn-fit.png"
            alt="QN Fit Logo"
            class="logo"
        />

        <!-- Stepper Container -->
        <p-stepper [(value)]="activeStep">
            <!-- Step List -->
            <div class="stepper-header">
                <p-step-list>
                    <p-step [value]="1">
                        <ng-template
                            #content
                            let-activateCallback="activateCallback"
                            let-value="value"
                        >
                            <button
                                (click)="activateCallback()"
                                class="step-button"
                            >
                                <span
                                    class="step-icon"
                                    [class.active]="value <= activeStep()"
                                >
                                    <i class="pi pi-user"></i>
                                </span>
                                <span class="step-label">Configuração da Conta</span>
                            </button>
                        </ng-template>
                    </p-step>

                    <p-step [value]="2">
                        <ng-template
                            #content
                            let-activateCallback="activateCallback"
                            let-value="value"
                        >
                            <button
                                (click)="activateCallback()"
                                class="step-button"
                            >
                                <span
                                    class="step-icon"
                                    [class.active]="value <= activeStep()"
                                >
                                    <i class="pi pi-briefcase"></i>
                                </span>
                                <span class="step-label">Detalhes Pessoais</span>
                            </button>
                        </ng-template>
                    </p-step>
                </p-step-list>
            </div>

            <!-- Title Section -->
            <div class="title-section">
                <h2 class="register-title">Criar Sua Conta de Nutricionista</h2>
                <span class="register-subtitle">
                    @if(activeStep() === 1) {
                        Vamos começar com algumas informações básicas para configurar seu perfil.
                    } @else {
                        Agora alguns detalhes pessoais e profissionais.
                    }
                </span>
            </div>

            <!-- Step Panels -->
            <p-step-panels>
                <!-- Step 1: Account Configuration -->
                <p-step-panel [value]="1">
                    <ng-template
                        #content
                        let-activateCallback="activateCallback"
                    >
                        <div class="step-content">
                            <div class="inputs-container">
                                <!-- Name Row -->
                                <div class="input-row">
                                    <div class="input-wrapper">
                                        <qn-text-input
                                            qnLabel="Nome"
                                            width="100%"
                                            [(value)]="firstName"
                                        />
                                    </div>
                                    <div class="input-wrapper">
                                        <qn-text-input
                                            qnLabel="Sobrenome"
                                            width="100%"
                                            [(value)]="lastName"
                                        />
                                    </div>
                                </div>
                                <qn-text-input
                                    type="email"
                                    qnLabel="E-mail"
                                    width="100%"
                                    autocomplete="off"
                                    [(value)]="email"
                                />
                                <qn-password-input
                                    qnLabel="Senha"
                                    width="100%"
                                    [(value)]="password"
                                />
                            </div>
                        </div>

                        <!-- Button Container -->
                        <div class="button-container">
                            <qn-button
                                label="Continuar"
                                width="100%"
                                (click)="activateCallback(2)"
                            />
                        </div>
                    </ng-template>
                </p-step-panel>

                <!-- Step 2: Personal Details -->
                <p-step-panel [value]="2">
                    <ng-template
                        #content
                        let-activateCallback="activateCallback"
                    >
                        <div class="step-content">
                            <div class="inputs-container">
                                <!-- Document Row -->
                                <div class="input-row">
                                    <div class="input-wrapper input-small">
                                        <qn-drop-down
                                            [options]="optionsDocument"
                                            [(value)]="selectedDocument"
                                            qnLabel="Documento"
                                            width="100%"
                                        />
                                    </div>
                                    <div class="input-wrapper input-large">
                                        <qn-mask-input
                                            qnLabel="Número do Documento"
                                            [mask]="documentMask()"
                                            [(value)]="documentNumber"
                                            [placeholder]="documentMask()"
                                            width="100%"
                                        />
                                    </div>
                                </div>

                                <qn-mask-input
                                    qnLabel="CRN"
                                    [mask]="'CRN-9/99999'"
                                    [(value)]="crn"
                                    [placeholder]="'CRN-9/99999'"
                                    width="100%"
                                />

                                <qn-mask-input
                                    qnLabel="Telefone"
                                    [mask]="'+55 (99) 99999-9999'"
                                    [(value)]="phone"
                                    [placeholder]="'+55 (99) 99999-9999'"
                                    width="100%"
                                />

                                <qn-drop-down
                                    [options]="optionsGender"
                                    [(value)]="selectedGender"
                                    qnLabel="Gênero (opcional)"
                                    width="100%"
                                    placeholder="Selecione seu gênero"
                                />
                            </div>
                        </div>

                        <!-- Button Container -->
                        <div class="button-container button-row">
                            <qn-button
                                label="Voltar"
                                width="100%"
                                (click)="activateCallback(1)"
                            />
                            <qn-button
                                label="Finalizar Cadastro"
                                width="100%"
                                (click)="finishRegistration()"
                            />
                        </div>
                    </ng-template>
                </p-step-panel>
            </p-step-panels>
        </p-stepper>

        <!-- Footer Link -->
        <div class="footer-link">
            <span>Já tem uma conta?</span>
            <a href="/login">Entrar</a>
        </div>
    </div>
</div>
</div>
