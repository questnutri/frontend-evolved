<qn-div
    minHeight="100vh"
    background="url(/assets/img/nutri-background.png) center/cover"
    flex-column
    justifyContent="center"
    alignItems="center"
    padding="20px"
    position="relative"
>
    <qn-div
        [style.max-width]="'600px'"
        [style.width]="'100%'"
        flex
        justifyContent="center"
        alignItems="center"
        [style.position]="'absolute'"
        [style.top]="'20px'"
    >
        <img
            src="/img/qn-fit-inversed.png"
            alt="QN Fit Logo"
            [style.width]="'100px'"
            [style.height]="'80px'"
            [style.object-fit]="'contain'"
        />
    </qn-div>

    <qn-div
        background="white"
        radius="20px"
        overflow="hidden"
        shadow="0 20px 40px rgba(0,0,0,0.1)"
        flex-column
        [style.max-width]="'500px'"
        [style.width]="'100%'"
        height="350px"
        position="relative"
        [style.z-index]="'1'"
        paddingX="20px"
    >
        <qn-div flex-column height="100%">
            <qn-div
                padding="30px 25px 0"
                grid
                color="auto 1fr"
                alignItems="center"
                textAlign="center"
            >
                <span class="pi-arrow-lef" style="color: green"></span>
                <h2
                    [style.color]="'black'"
                    [style.font-size]="'22px'"
                    [style.font-weight]="'600'"
                    [style.margin]="'0'"
                >
                    Recuperar Senha
                </h2>
            </qn-div>
        </qn-div>

        <qn-div
            flex-column
            padding="20px"
            justifyContent="space-between"
            gap="15px"
            [style.flex]="'1'"
        >
            @if(currentStep() === 1) {
            <forgot-password-request (nextStep)="goToStep(2)" />
            } @if(currentStep() === 2) {
            <forgot-password-reset
                (nextStep)="goToStep(3)"
                (previousStep)="goToStep(1)"
            />
            } @if(currentStep() === 3) {
            <forgot-password-verify (previousStep)="goToStep(2)" />
            }
        </qn-div>
    </qn-div>
</qn-div>
