<qn-div
    minHeight="100vh"
    background="url(/assets/img/nutri-background.png) center/cover"
    flex-column
    justifyContent="center"
    alignItems="center"
    padding="20px"
    position="relative"
>
    <qn-div
        [style.max-width]="'600px'"
        [style.width]="'100%'"
        flex
        justifyContent="center"
        alignItems="center"
        [style.position]="'absolute'"
        [style.top]="'20px'"
    >
        <img
            src="/img/qn-fit-inversed.png"
            alt="QN Fit Logo"
            [style.width]="'100px'"
            [style.height]="'80px'"
            [style.object-fit]="'contain'"
        />
    </qn-div>

    <qn-div
        background="white"
        radius="20px"
        overflow="hidden"
        shadow="0 20px 40px rgba(0,0,0,0.1)"
        flex-column
        [style.max-width]="'500px'"
        [style.width]="'100%'"
        height="350px"
        position="relative"
        [style.z-index]="'1'"
        paddingX="20px"
    >
        <qn-div flex-column height="100%">
            <qn-div
                padding="30px 25px 0"
                grid
                columns="auto 1fr"
                alignItems="center"
                textAlign="center"
            >
                <span
                    class="pi pi-arrow-left icon-back"
                    style="color: var(--black-color); font-size: 20px"
                    (click)="goToLogin()"
                    title="Login"
                ></span>
                <h2
                    [style.color]="'black'"
                    [style.font-size]="'22px'"
                    [style.font-weight]="'600'"
                    [style.margin]="'0'"
                >
                    @if(!firstLogin()) { Recuperar Senha }@else { Definir Senha
                    Inicial }
                </h2>
            </qn-div>
        </qn-div>

        <qn-div
            flex-column
            padding="20px"
            justifyContent="space-between"
            gap="15px"
            [style.flex]="'1'"
        >
            @if(currentStep() === 1) {
            <app-forgot-password (nextStep)="goToStep(2, $event)" />
            } @if(currentStep() === 2) {
            <app-token
                (nextStep)="goToStep(3, null)"
                (previousStep)="goToStep(1, null)"
                [token]="resetToken()"
                [firstLogin]="firstLogin()"
            />
            } @if(currentStep() === 3) {
            <app-reset
                (previousStep)="goToStep(2, null)"
                [token]="resetToken()"
                [firstLogin]="firstLogin()"
            />
            }
        </qn-div>
    </qn-div>
</qn-div>
