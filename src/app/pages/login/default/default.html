<div [style.padding]="'25px 25px 0'" [style.text-align]="'center'">
    <h2
        [style.color]="'white'"
        [style.font-size]="'22px'"
        [style.font-weight]="'600'"
        [style.margin]="'0'"
    >
        Login
    </h2>
</div>

<div
    [style.flex]="'1'"
    [style.padding]="'25px'"
    [style.display]="'flex'"
    [style.flex-direction]="'column'"
    [style.justify-content]="'center'"
    [style.gap]="'20px'"
>
    <qn-text-input 
        type="email" 
        [(value)]="emailInput" 
        qnLabel-white="E-mail"
        />

    <qn-password-input 
        [(value)]="passwordInput"
        qnLabel-white="Senha"
        />

    <a href="#" class="forgot-password">Esqueci minha senha</a>

    <qn-button
        label="Login"
        (click)="doLogin()"
        width="100%"
        cursor="pointer"
    />
</div>
