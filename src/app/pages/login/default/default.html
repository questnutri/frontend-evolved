<div [style.padding]="'25px 25px 0'" [style.text-align]="'center'">
    <h2
        [style.color]="'white'"
        [style.font-size]="'22px'"
        [style.font-weight]="'600'"
        [style.margin]="'0'"
    >
        Login
    </h2>
</div>

<div
    [style.flex]="'1'"
    [style.padding]="'25px'"
    [style.display]="'flex'"
    [style.flex-direction]="'column'"
    [style.justify-content]="'center'"
    [style.gap]="'20px'"
>
    <app-qn-text-input type="email" [(value)]="emailInput" label="E-mail" />
    <app-qn-password-input [(value)]="passwordInput" label="Password" />

    <app-qn-text-area label="Texto"></app-qn-text-area>

    <!-- <app-qn-number-input label="Teste" labelPosition="in" /> -->

    <a
        href="#"
        [style.color]="'white'"
        [style.text-decoration]="'none'"
        [style.font-size]="'14px'"
        [style.text-align]="'center'"
        [style.opacity]="'0.9'"
        [style.transition]="'opacity 0.3s ease'"
        >Esqueci minha senha</a
    >

    <qn-button label="Login" (click)="doLogin()" />
</div>
