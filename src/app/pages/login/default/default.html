<div [style.padding]="'30px 25px 0'" [style.text-align]="'center'">
    <h2
        [style.color]="'black'"
        [style.font-size]="'22px'"
        [style.font-weight]="'600'"
        [style.margin]="'0'"
    >
        Login
    </h2>
</div>

<div
    [style.flex]="'1'"
    [style.padding]="'25px'"
    [style.display]="'flex'"
    [style.flex-direction]="'column'"
    [style.justify-content]="'center'"
    [style.gap]="'15px'"
>
    <qn-text-input type="email" [(value)]="emailInput" qnLabel="E-mail" />

    <qn-password-input [(value)]="passwordInput" qnLabel="Senha" />

    <a href="/forgot-password" class="forgot-password">Esqueci minha senha</a>

    <qn-button label="Login" (click)="doLogin()" width="70%" cursor="pointer" />
</div>
