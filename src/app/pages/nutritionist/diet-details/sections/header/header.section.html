<div class="diet-details-header">
    <app-back-button text="Voltar aos detalhes" (onClick)="goBackToPatient()" />
    <div class="diet-details-header-diet-infos">
        <div class="diet-card-header">
            <p-chip
                [label]="(diet().status | dietStatus).value"
                class="diet-chip"
                [style.backgroundColor]="
                        (diet().status | dietStatus).color
                    "
                [style.color]="'white'"
            />
            <span class="diet-details-header-title">{{ diet().name }}</span>
        </div>
        <span class="diet-details-header-patient-name"
            ><strong>Paciente:</strong>{{ patient()?.firstName }} {{
            patient()?.lastName }}</span
        >
    </div>
    <div class="diet-details-header-diet-dates">
        <span class="diet-details-header-patient-name"
            ><strong>Início:</strong>
            <p-datepicker
                [ngModel]="startDate()"
                (ngModelChange)="startDate.set($event); onDateChange()"
                [showIcon]="true"
                inputId="icondisplay"
                [disabled]="disabledDates().disabledStartDate"
                [minDate]="minDateStartPicker()"
                [maxDate]="maxDateStartPicker()"
            />
        </span>
        <span class="diet-details-header-patient-name"
            ><strong>Fim:</strong>
            <p-datepicker
                [ngModel]="endDate()"
                (ngModelChange)="endDate.set($event); onDateChange()"
                [showIcon]="true"
                inputId="icondisplay"
                [disabled]="disabledDates().disabledEndDate"
                [minDate]="minDateEndPicker()"
            />
        </span>
    </div>
</div>
