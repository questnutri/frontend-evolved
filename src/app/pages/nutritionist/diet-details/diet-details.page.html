<div
    class="diet-details-layout"
    [class.sidebar-collapsed]="!isCalendarVisible()"
    [ngClass]="{'editing-meal': editingMeal()}"
>
    @if(dietPlan()){
    <div class="diet-details-header">
        <app-patient-diet-details-header
            [patientId]="patientId()"
            [diet]="dietPlan()!.diet"
            (dietUpdated)="refreshDietPlan()"
        />
    </div>

    <div class="diet-details-sidebar" [class.collapsed]="!isCalendarVisible()">
        <div class="calendar-wrapper" [class.hidden]="!isCalendarVisible()">
            <p-datepicker
                [inline]="!deviceService.isMobileSize()"
                [(ngModel)]="date"
                (onMonthChange)="doOnMonthChange($event)"
                [selectOtherMonths]="true"
                class="date"
                [showIcon]="deviceService.isMobileSize()"
                [minDate]="dietStartDate()"
                [maxDate]="dietEndDate()"
                fluid
            >
                <ng-template pTemplate="header" let-api="api">
                    <div class="custom-header">
                        <i
                            class="pi pi-calendar header-icon"
                            style="font-size: 1.4rem"
                            pTooltip="Ocultar calendário"
                            (click)="toggleCalendar()"
                        ></i>
                    </div>
                </ng-template>
            </p-datepicker>
        </div>

        <div class="sidebar-collapsed-content">
            <button
                class="show-calendar-btn"
                (click)="toggleCalendar()"
                pTooltip="Mostrar calendário"
                showDelay="500"
                hideDelay="300"
            >
                <i class="pi pi-calendar"></i>
            </button>
        </div>
    </div>

    <div
        class="diet-details-container"
        [ngClass]="{'edit-open': editingMeal()}"
    >
        <div class="diet-details-content">
            <div
                style="
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    padding: 0 1rem;
                "
            >
                <div class="diet-details-content-header">
                    <span class="diet-details-content-header-date"
                        >{{ dateFormat() }}</span
                    >
                    <div class="diet-details-content-header-total-kcals">
                        <span>Total</span>
                        <span
                            class="diet-details-content-header-total-kcals-value"
                        >
                            {{ totalKcalMealsRelativeDate() }} kcal
                        </span>
                    </div>
                </div>
                <qn-button
                    label="Adicionar Refeição"
                    icon="pi pi-plus"
                    class="add-meal-button"
                    (click)="showModalNewDiet()"
                ></qn-button>
            </div>
            <div class="diet-details-content-meals-list">
                @if (mealsDietRelativeDate().length > 0) { @for (meal of
                mealsDietRelativeDate(); track $index) {
                <app-meal-display
                    [meal]="meal"
                    [class.selected]="editingMeal() === meal"
                    (click)="openEditMeal(meal)"
                >
                </app-meal-display>
                } }
            </div>
        </div>
        @if(editingMeal()) {
        <div class="edit-meal" [ngClass]="{visible: editingMeal()}">
            <app-meal-panel
                [meal]="editingMeal()!"
                [currentRelativeDate]="currentRelativeDate()"
                (closeEditMeal)="closeEditMeal()"
                (mealUpdated)="onMealUpdated()"
            />
        </div>
        }
    </div>
    }
</div>
<p-dialog
    header="Nova Refeição"
    [(visible)]="visible"
    [modal]="true"
    [closeOnEscape]="true"
    [dismissableMask]="true"
    [contentStyle]="{ padding: '0' }"
    class="simple-new-diet-dialog"
    appendTo="body"
>
    <div class="dialog-content">
        <qn-text-input
            qnLabel="Nome da Refeição"
            placeholder="Ex: Almoço"
            [(value)]="mealName"
            [qnLabelStyle]="{
                color: 'var(--primary-font-color)'
            }"
        />

        <qn-text-input
            qnLabel="Descrição (opcional)"
            placeholder="Ex: Refeição rica em proteínas"
            [(value)]="mealDescription"
            [qnLabelStyle]="{
                color: 'var(--primary-font-color)'
            }"
        />

        <p-datepicker
            inputId="calendar-timeonly"
            [timeOnly]="true"
            qnLabel="Hora"
            style="align-self: flex-end; width: 100%"
            class="day-picker"
            [autofocus]="false"
            [qnLabelStyle]="{
                color: 'var(--primary-font-color)'
            }"
            [appendTo]="'body'"
            [(ngModel)]="formHour"
        />
    </div>

    <ng-template pTemplate="footer">
        <div class="dialog-footer">
            <qn-button
                label="Cancelar"
                (click)="visible.set(false)"
                colorStyle="gray"
            />
            <qn-button label="Criar Refeição" (click)="addMeal()" />
        </div>
    </ng-template>
</p-dialog>
