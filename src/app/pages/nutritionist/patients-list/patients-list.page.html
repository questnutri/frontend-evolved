<qn-div
    class="patients-container"
    width="100%"
    height="100%"
    flex-column
    background-color="var(--secondary-background-color)"
    radius="var(--border-radius-input)"
    overflow="hidden"
    boxSizing="border-box"
    gap="10px"
>
    <qn-div
        class="patients-content"
        background="var(--primary-background-color)"
        radius="var(--border-radius-input)"
        flex-column
        height="100%"
        padding="2rem"
        [style.flex]="1"
    >
        <qn-div
            class="patients-header"
            grid
            columns="auto auto"
            justifyContent="space-between"
            alignItems="center"
        >
            <h2>Meus Pacientes</h2>
            <qn-button 
                label="Novo Paciente" 
                icon="pi pi-user-plus" 
                (click)="openNewPatientDialog()"
            />
        </qn-div>

        <qn-div
            class="search-filter-bar"
            background="var(--secondary-background-color)"
            padding="1rem"
            grid
            columns="1fr minmax(150px, 20%)"
            justifyContent="space-between"
            gap="15px"
            radius="var(--border-radius-input)"
            border="1px solid var(--primary-border-color)"
            alignItems="center"
        >
            <qn-text-input
                placeholder="Procurar paciente por nome, e-mail ou CPF..."
                icon="pi pi-search"
                [(value)]="searchTerm"
            />

            <qn-drop-down
                [options]="sortOptions"
                [(value)]="selectedSort"
                placeholder="Ordenar por"
            />
        </qn-div>

        <qn-div class="table-wrapper" width="100%" marginTop="1.5rem">
            @if(patients().length > 0) {
            <p-table
                [value]="patients()"
                stripedRows
                [paginator]="true"
                [rows]="5"
                [rowsPerPageOptions]="[5, 10, 20, 50]"
                [loading]="loading()"
                [globalFilterFields]="['name', 'email', 'documentNumber']"
                [scrollable]="true"
                scrollHeight="80vh"
            >
                <ng-template pTemplate="header">
                    <tr>
                        <th pSortableColumn="name" style="width: 40%">
                            Nome
                            <p-sortIcon field="name"></p-sortIcon>
                        </th>
                        <th pSortableColumn="email" style="width: 35%">
                            E-mail
                            <p-sortIcon field="email"></p-sortIcon>
                        </th>
                        <th pSortableColumn="documentNumber" style="width: 20%">
                            CPF
                            <p-sortIcon field="documentNumber"></p-sortIcon>
                        </th>
                        <th class="actions-column" style="width: 5%">Ações</th>
                    </tr>
                </ng-template>

                <ng-template pTemplate="body" let-patient>
                    <tr>
                        <td>
                            <div class="patient-name-cell">
                                <img
                                    class="patient-avatar"
                                    [src]="'https://ui-avatars.com/api/?name=' + patient?.name + '&background=57b5fb&color=fff'"
                                    alt="Avatar"
                                    style="
                                        width: 36px;
                                        height: 36px;
                                        border-radius: 50%;
                                        object-fit: cover;
                                    "
                                />
                                <strong>{{ patient?.firstName }} {{ patient?.lastName }}</strong>
                            </div>
                        </td>
                        <td>{{ patient.email }}</td>
                        <td>{{ patient.documentNumber }}</td>
                        <td class="action-icon">
                            <i
                                class="pi pi-eye"
                                (click)="viewPatient(patient.id)"
                            ></i>
                        </td>
                    </tr>
                </ng-template>

                <ng-template pTemplate="emptymessage">
                    <tr>
                        <td
                            colspan="5"
                            class="empty-state-cell"
                            style="
                                text-align: center;
                                padding: 3rem;
                                color: var(--secondary-font-color);
                            "
                        >
                            <i
                                class="pi pi-users empty-state-icon"
                                style="
                                    font-size: 3rem;
                                    opacity: 0.3;
                                    margin-bottom: 1rem;
                                    display: block;
                                "
                            ></i>
                            <p class="empty-state-text">
                                Nenhum paciente encontrado
                            </p>
                            @if (searchTerm()) {
                            <qn-button
                                label="Limpar busca"
                                size="small"
                                type="outline"
                            />
                            }
                        </td>
                    </tr>
                </ng-template>
            </p-table>
            }
        </qn-div>
    </qn-div>
</qn-div>

<!-- New Patient Dialog -->
<p-dialog
    header="Novo Paciente"
    [(visible)]="showNewPatientDialog"
    [modal]="true"
    [closable]="true"
    [draggable]="false"
    [resizable]="false"
    [style]="{ width: '600px', maxWidth: '95vw' }"
    styleClass="new-patient-dialog"
    (onHide)="closeNewPatientDialog()"
>
    <div class="dialog-content">
        <!-- Section: Informações Básicas -->
        <div class="form-section">
            <h4 class="section-title">
                <i class="pi pi-user"></i>
                Informações Básicas
            </h4>
            
            <div class="form-row">
                <div class="form-field">
                    <qn-text-input
                        qnLabel="Nome *"
                        [value]="newPatient().firstName"
                        (valueChange)="updateFormField('firstName', $event ?? '')"
                        placeholder="Digite o nome"
                        width="100%"
                    />
                </div>
                <div class="form-field">
                    <qn-text-input
                        qnLabel="Sobrenome *"
                        [value]="newPatient().lastName"
                        (valueChange)="updateFormField('lastName', $event ?? '')"
                        placeholder="Digite o sobrenome"
                        width="100%"
                    />
                </div>
            </div>

            <div class="form-row">
                <div class="form-field">
                    <qn-text-input
                        qnLabel="E-mail *"
                        type="email"
                        [value]="newPatient().email"
                        (valueChange)="updateFormField('email', $event ?? '')"
                        placeholder="email@exemplo.com"
                        width="100%"
                    />
                </div>
            </div>

            <div class="form-row">
                <div class="form-field">
                    <qn-mask-input
                        qnLabel="CPF *"
                        [mask]="'999.999.999-99'"
                        [value]="newPatient().documentNumber"
                        (valueChange)="updateFormField('documentNumber', $event ?? '')"
                        placeholder="000.000.000-00"
                        width="100%"
                    />
                </div>
                <div class="form-field">
                    <qn-mask-input
                        qnLabel="Telefone"
                        [mask]="'+55 (99) 99999-9999'"
                        [value]="newPatient().phone ?? ''"
                        (valueChange)="updateFormField('phone', $event ?? '')"
                        placeholder="+55 (99) 99999-9999"
                        width="100%"
                    />
                </div>
            </div>
        </div>

        <!-- Section: Dados Pessoais -->
        <div class="form-section">
            <h4 class="section-title">
                <i class="pi pi-id-card"></i>
                Dados Pessoais
            </h4>

            <div class="form-row">
                <div class="form-field">
                    <label class="field-label">Data de Nascimento</label>
                    <p-datepicker
                        [ngModel]="newPatient().dateOfBirth"
                        (ngModelChange)="updateFormField('dateOfBirth', $event)"
                        dateFormat="dd/mm/yy"
                        [maxDate]="today"
                        [showIcon]="true"
                        placeholder="Selecione a data"
                        styleClass="w-full"
                        appendTo="body"
                    />
                </div>
                <div class="form-field">
                    <label class="field-label">Gênero</label>
                    <p-select
                        [options]="genderOptions"
                        [ngModel]="newPatient().gender"
                        (ngModelChange)="updateFormField('gender', $event)"
                        optionLabel="label"
                        optionValue="value"
                        placeholder="Selecione o gênero"
                        styleClass="w-full"
                        appendTo="body"
                    />
                </div>
            </div>
        </div>

        <!-- Section: Dados Físicos -->
        <div class="form-section">
            <h4 class="section-title">
                <i class="pi pi-heart"></i>
                Dados Físicos
            </h4>

            <div class="form-row">
                <div class="form-field">
                    <label class="field-label">Altura (cm)</label>
                    <p-inputNumber
                        [ngModel]="newPatient().heightInCm"
                        (ngModelChange)="updateFormField('heightInCm', $event)"
                        [min]="50"
                        [max]="250"
                        placeholder="Ex: 170"
                        styleClass="w-full"
                        [showButtons]="false"
                    />
                </div>
                <div class="form-field">
                    <label class="field-label">Nível de Atividade</label>
                    <p-select
                        [options]="activityLevelOptions"
                        [ngModel]="newPatient().levelOfActivity"
                        (ngModelChange)="updateFormField('levelOfActivity', $event)"
                        optionLabel="label"
                        optionValue="value"
                        placeholder="Selecione o nível"
                        styleClass="w-full"
                        appendTo="body"
                    />
                </div>
            </div>
        </div>
    </div>

    <ng-template pTemplate="footer">
        <div class="dialog-footer">
            <qn-button
                label="Cancelar"
                type="outline"
                (click)="closeNewPatientDialog()"
                [disabled]="saving()"
            />
            <qn-button
                label="Criar Paciente"
                icon="pi pi-check"
                (click)="saveNewPatient()"
                [disabled]="saving()"
                [loading]="saving()"
            />
        </div>
    </ng-template>
</p-dialog>
