<div style="display: grid; grid-template-columns: 1fr 5fr;">
    <div style="height: auto; background: white;">
        <div class="back-navigation" (click)="backToPatients()">
            <i class="pi pi-arrow-left back-icon"></i>
            <span class="back-text">Voltar aos Pacientes</span>
        </div>

        <div class="avatar-section">
            <img
                src="https://ui-avatars.com/api/?name=Lucas&size=120&background=0380dc&color=fff"
                alt="Foto de Perfil"
                class="avatar"
            />
            <h4 class="name">Lucas</h4>
            <h5 class="email">lucas@mail.com</h5>
        </div>

        <div class="menu-list">
            @for(item of patientNavItems; track $index) {
            <div
                class="item-list"
                [routerLink]="[item.route]"
                [queryParamsHandling]="'preserve'"
                [routerLinkActive]="'active'"
                [routerLinkActiveOptions]="{ exact: true }"
                [relativeTo]="activatedRoute"
            >
                <i class="pi" [ngClass]="item.icon"></i
                ><span>{{item.label}}</span>
            </div>
            }
            
        </div>
    </div>
    <div style="background: blue;">
        <router-outlet></router-outlet>
    </div>
</div>
