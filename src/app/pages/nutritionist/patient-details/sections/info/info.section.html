@if(patient()) {
    @for(info of infoSections; track $index) {
        <div
            [style]="{
                'overflow-x': 'hidden',
                'overflow-y': 'auto',
            }"
        >
            <div
                [style]="{
                'background-color': 'white'
            }"
            >
                <h2 class="card-name">{{info.mainLabel}}</h2>
        
                <div class="details-grid">
                    @for(detail of info.details; track $index) {
                        <div class="detail-item">
                            <p class="label">{{detail.label}}:</p>
                            <p>{{detail.value()}}</p>
                        </div>
                    }
                </div>
            </div>
            <hr />
        </div>
    }
}
