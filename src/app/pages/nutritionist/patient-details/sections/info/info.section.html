<div class="info-wrapper">
    <div class="info-layout">
        @if(patient()) {
        <div class="info-content-scroll">
            @for(info of infoSections; track $index) {
            <div class="nutri-patient-card">
                <h2 class="info-card-name">{{info.mainLabel}}</h2>

                <div class="info-details-grid">
                    @for(detail of info.details; track $index) {
                    <div class="detail-item">
                        <p class="label">{{detail.label}}:</p>
                        <p>{{detail.value()}}</p>
                    </div>
                    }
                </div>
                <hr />
            </div>
            }
        </div>
        }
    </div>
</div>
