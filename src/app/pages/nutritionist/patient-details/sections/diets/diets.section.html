<div class="diets-section">
    <div class="diets-section-container">
        <div class="diets-content-scroll">
            <div class="diets-section-header">
                <h2 class="diets-section-header-title">Dietas</h2>
                <qn-button label="Adicionar Dieta" icon="pi pi-plus" />
            </div>

            <!-- Check if diets exist -->
            @if(diets().length > 0) {
            <!-- Loop through diets and display each one -->
            @for(diet of diets(); track $index){
            <div class="diets-card">
                <div class="diet-card-title">
                    <h3 class="diet-card-name">{{diet.name}}</h3>
                    <p-chip
                        [label]="(diet.status | dietStatus).value"
                        class="diet-chip"
                        [style.backgroundColor]="(diet.status | dietStatus).color"
                    />
                </div>
                <p class="diet-card-icon"><i class="pi pi-ellipsis-v"></i></p>
                <span class="diet-card-date"
                    >{{dateFormat(diet.startDate)}} até
                    {{dateFormat(diet.endDate)}}</span
                >
                <span>85%</span>
                <qn-button
                    label="Ver Dieta"
                    class="view-diet-button"
                    colorStyle="white"
                    icon="pi pi-calendar"
                    (click)="doOnSeeDiet(diet.id)"
                />
            </div>

            }
            <!-- If no diets exist -->
            }@else{

            <div></div>
            }
        </div>
    </div>
</div>
